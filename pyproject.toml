[project]
name = "music-recommendations"
version = "0.1.0"
description = "Jazz recommender: licensed previews + CLAP analysis + axis-based ranking"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pymongo>=4.6",
    "numpy>=1.26",
    # The galaxy layout (server/viz.project_umap). A RUNTIME dependency, not
    # an analysis one: the API process draws the map, and the box that runs
    # it need not be the box that has torch. Pulls numba + llvmlite (both
    # BSD), which is why it is imported inside the function that uses it.
    "umap-learn>=0.5",
]

[project.optional-dependencies]
# The analysis stack: CLAP for the embedding and the text tower, Beat This!
# for beats, librosa/pyloudnorm/soxr for the exact DSP. Every one of them is
# MIT/BSD/ISC (soxr LGPL, dynamically linked) -- that is the whole point of
# the clean-room work, and tests/test_licences.py fails on anything
# non-commercial reappearing here.
#
# Only the WORKER needs this extra. The API ranks stored vectors and draws
# maps; the one thing it may load is CLAP's text tower for /search/text, on
# a box where this extra happens to be installed.
#
# Every distribution named here must have a row in docs/THIRD_PARTY.md --
# tests/test_licences.py enforces that.
analysis = [
    "torch>=2.2",
    "msclap>=1.3",
    "librosa>=0.10",
    "pyloudnorm>=0.1",
    "soxr>=0.3",
    # Pinned to a commit, not to the branch: the project publishes no
    # release on PyPI, so an unpinned git URL means "whatever main was on
    # the day this image happened to build" -- and a beat tracker that
    # changes its answers changes every stored tempo (FEATURES_VERSION).
    # Bumping this is a deliberate act with a re-analysis behind it.
    "beat_this @ git+https://github.com/CPJKU/beat_this@b95c8ab0c58c2d9fcfd40508ae8dffbc05ac4f5c",
]
dev = ["pytest>=8.0", "httpx>=0.27", "mongomock>=4.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_recommendations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:flask"
