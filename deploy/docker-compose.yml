# Essentia stack. Lives at /home/ubuntu/stacks/essentia (a git checkout of the
# repo) on the VM; run from there:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Nothing here binds a host port: Caddy (~/stacks/caddy) reaches the API by
# container name over the external `web` network. See deploy/README.md.

name: essentia

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: essentia:local
    container_name: essentia-api
    restart: unless-stopped
    env_file: .env
    command: >
      uvicorn music_recommendations.server.app:app
      --host 0.0.0.0 --port 8000 --workers 1
    expose:
      - "8000"
    networks: [web]
    # The corpus matrices (float32, 1024-d since v4) plus the UMAP layout.
    # /seed never analyzes -- every unknown track goes to the worker -- so in
    # the DEFAULT configuration this process holds no model at all and 3g
    # would do.
    #
    # 6g is sized for the one thing that changes that: TEXT_SEARCH=1. There
    # is no text-tower-only load in the msclap API, so the first /search/text
    # pulls the WHOLE model into this process -- ~700 MB of weights, ~2.5 GB
    # resident once torch's allocator is warm -- and it stays. With the flag
    # off (the default) the headroom is simply unused; with it on, this is
    # the limit that stops the first text query OOM-killing the API.
    mem_limit: 6g
    cpus: 1.5

  worker:
    image: essentia:local
    container_name: essentia-worker
    restart: unless-stopped
    depends_on: [api]
    env_file: .env
    command: python -m music_recommendations.worker
    networks: [web]
    # The only process that loads the CLAP AUDIO tower: ~700 MB of weights
    # and ~2.5 GB resident once torch's allocator is warm, plus Beat This!
    # and a group of decoded 30 s waveforms. Raised from 3g accordingly.
    mem_limit: 4g
    cpus: 1.0

networks:
  web:
    external: true
